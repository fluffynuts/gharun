# Tests on every push, builds a zip for every platform, and publishes a
# GitHub release from a push to master.
#
# Release versions are VERSION (major.minor, bumped by hand) plus the run
# number as the third part: 0.1.57.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    # Cross-compiled from Linux: no cgo, and zip(1) keeps the executable bit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Package
        id: dist
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD: ${{ github.run_number }}
        run: |
          zip=$(./make.sh dist | tail -n 1)
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dist.outputs.zip }}
          # Upload the zip as is, rather than wrapped in a second zip.
          archive: false
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: gharun-*.zip
          merge-multiple: true
          path: dist
          skip-decompress: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          version="$(tr -d '[:space:]' <VERSION).$BUILD"
          tag="v$version"
          mapfile -t zips < <(find dist -type f -name 'gharun-*.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::no release zips found under dist/"
            find dist -ls
            exit 1
          fi
          # Published under fixed names (gharun-linux-amd64.zip, ...) so
          # releases/latest/download/<name> always works.
          mkdir -p release
          for zip in "${zips[@]}"; do
            unzip -tq "$zip" >/dev/null || { echo "::error::$zip is not a valid zip"; exit 1; }
            name=$(basename "$zip")
            cp "$zip" "release/${name/-$version/}"
          done
          (cd release && sha256sum gharun-*.zip >SHA256SUMS)
          cat release/SHA256SUMS
          assets=(release/gharun-*.zip release/SHA256SUMS)
          # A re-run finds its release already made, and replaces the zips.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "gharun $version" \
              --generate-notes \
              --latest
          fi
